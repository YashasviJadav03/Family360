services:
  # -------------------------------------------------------------
  # Backend API Service (FastAPI)
  # -------------------------------------------------------------
  - type: web
    name: family360-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore # or oregon / frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: family360-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SEED_FAMILIES_COUNT
        value: "300"
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false

  # -------------------------------------------------------------
  # Frontend Static Site (React + Vite)
  # -------------------------------------------------------------
  - type: web
    name: family360-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: family360-backend
          property: host

# ---------------------------------------------------------------
# Managed PostgreSQL Database
# ---------------------------------------------------------------
databases:
  - name: family360-db
    plan: free
    region: singapore
    databaseName: family360
    user: family360_user
